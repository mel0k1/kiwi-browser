# Memory tuning preferences

- name: dom.ipc.processPrelaunch.enabled
  value: false

- name: browser.tabs.unloadOnLowMemory
  value: true

- name: browser.low_commit_space_threshold_percent
  value: 10

- name: media.memory_caches_combined_limit_kb
  value: 262144

- name: browser.sessionstore.max_tabs_undo
  value: 5
